<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Campus Connect — Placement Portal{% endblock %}</title>
  
  <!-- Immediate Theme Initializer (prevents flash-of-wrong-theme) -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('campus_theme') || '{{ theme or "light" }}';
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
    })();
  </script>

    <!-- Official Brand Favicon & Touch Icons -->
  <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">

  <!-- Typography: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Flash Message Carrier -->
  {% include "_flash.html" %}

  <!-- Page Body -->
  {% block body %}{% endblock %}

  <!-- Global Floating AI Career Chatbot -->
  {% include "_chatbot.html" %}

  <!-- Toast Notification Root Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Core Interactive Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
